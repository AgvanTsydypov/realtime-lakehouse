# Our pipeline as a SparkApplication: the operator turns this into driver + executor pods.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: lakehouse-pipeline
  namespace: lakehouse
spec:
  type: Python
  mode: cluster
  image: "lakehouse-spark:latest"
  imagePullPolicy: Never          # use our locally built image, do not pull from a registry
  mainApplicationFile: "local:///opt/spark/work-dir/pipeline_k8s.py"
  sparkVersion: "3.5.3"
  driver:
    cores: 1
    memory: "1g"
    serviceAccount: spark-operator-spark   # RBAC identity created by the operator
  executor:
    instances: 2
    cores: 1
    memory: "1g"
